
[project]
name = "rag-001"
version = "0.1.0"
description = "Naive RAG learning project"
readme = "README.md"
requires-python = ">=3.13.15"
dependencies = [
    "chromadb>=1.5.9",
    "docling>=2.140.0",
    "langchain>=1.4.6",
    "langchain-chroma>=1.1.0",
    "langchain-community>=0.4.2",
    "langchain-core>=1.6.12",
    "langchain-docling>=3.0.0",
    "langchain-nvidia-ai-endpoints>=1.5.0",
    "langchain-openai>=1.7.2",
    "langchain-text-splitters>=1.1.3",
    "langgraph>=1.2.16",
    "pypdf>=6.21.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
rag-001 = "rag01:main"

[build-system]
requires = ["uv_build>=0.12.10,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "rag01"
module-root = "src"
